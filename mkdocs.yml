site_name: EdraWiki
site_description: Hub central de documentação técnica, guias e tutoriais da EDRA (UnB)
repo_name: "EdraWiki"
repo_url: https://github.com/edra-unb-fga/EdraWiki
docs_dir: docs

nav:
  - Início: 'index.md'
  - Primeiros passos: 'primeiros-passos.md'
  - Mapa da Documentação: 'mapa-da-documentacao.md'
  - Setup e Instalação:
      - Visão geral: 'setup/index.md'
      - Instalação nativa (Linux): 'setup/instalacao-nativa.md'
      - Docker no Windows (WSL2): 'setup/docker-windows.md'
      - Ponte uXRCE-DDS (PX4 ↔ ROS 2): 'setup/uxrce-dds.md'
  - Simulação:
      - CBR2025 — Arena + Missão 1: 'simulacao/cbr2025-arena-missao1.md'
      - Inicialização desacoplada (troubleshooting): 'simulacao/inicializacao-desacoplada.md'
      - Lista de erros comuns: 'simulacao/erros-comuns.md'
  - Controle:
      - Visão geral: 'controle/index.md'
      - Modo Offboard (posição × velocidade): 'controle/offboard.md'
      - Sistemas de coordenadas (NED × ENU): 'controle/coordenadas.md'
      - Árvores de comportamento (py_trees): 'controle/behavior-trees.md'
  - Visão Computacional:
      - Visão geral: 'visao/index.md'
      - Dataset sintético e treino (YOLO): 'visao/dataset-e-treino.md'
  - Hardware / Raspberry:
      - Visão geral: 'hardware/index.md'
  - Como contribuir: 'contribuir.md'

theme:
  name: material
  language: pt
  logo: img/logo-edra.png
  favicon: img/logo-edra.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: green
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/edra-unb-fga
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/edra-unb
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/edraunb
